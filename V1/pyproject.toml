[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "C4",
    "ASYNC",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = "tests/api_tests"
markers = [
    "integration: marks tests that can use real network calls",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
